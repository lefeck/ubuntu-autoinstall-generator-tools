#cloud-config
autoinstall:
  apt:
    disable_components: []
    disable_suites: [security]
    geoip: true
    preserve_sources_list: false
    primary:
    - arches:
      - amd64
      - i386
      uri: https://mirrors.tuna.tsinghua.edu.cn/ubuntu
    - arches:
      - default
      uri: http://ports.ubuntu.com/ubuntu-ports
  drivers:
    install: false
  identity:
    hostname: msa
    # default password: 1qaz@WSX
    password: $6$x666Mgrn9NRnY5bs$rQogVX3FO3JVFc7wzy4krvMUGiCP6/spTI/b/eVc5kr78AlA2LLf5dtm2yfljjzgUBX4.0Zd97PXHayWz4pFQ/
    realname: msa
    username: msa
  kernel:
    package: linux-generic
  keyboard:
    layout: us
    toggle: null
    variant: ''
  locale: en_US.UTF-8
  network:
    version: 2
    renderer: networkd
    ethernets:
      eth0:
        dhcp4: false
      eth1:
        dhcp4: false
      eth2:
        dhcp4: false
      eth3:
        dhcp4: false
      eth4:
        dhcp4: false
      eth5:
        dhcp4: false
      eth6:
        dhcp4: false
      eth7:
        dhcp4: false
      eth8:
        dhcp4: false
      eth9:
        dhcp4: false
    bridges:
      br0:
        interfaces: [ eth0 ]
        addresses: [ 192.168.1.1/24 ]
        routes:
          - to: default
            via: 192.168.1.254
            metric: 100
            on-link: true
        nameservers:
          addresses: [ 114.114.114.114 ]
        parameters:
          stp: true
          forward-delay: 4
      br1:
        interfaces: [ eth1 ]
        parameters:
          stp: true
          forward-delay: 4
      br2:
        interfaces: [ eth2 ]
        parameters:
          stp: true
          forward-delay: 4
      br3:
        interfaces: [ eth3 ]
        parameters:
          stp: true
          forward-delay: 4
      br4:
        interfaces: [ eth4 ]
        parameters:
          stp: true
          forward-delay: 4
      br5:
        interfaces: [ eth5 ]
        parameters:
          stp: true
          forward-delay: 4
      br6:
        interfaces: [ eth6 ]
        parameters:
          stp: true
          forward-delay: 4
      br7:
        interfaces: [ eth7 ]
        parameters:
          stp: true
          forward-delay: 4
      br8:
        interfaces: [ eth8 ]
        parameters:
          stp: true
          forward-delay: 4
      br9:
        interfaces: [ eth9 ]
        parameters:
          stp: true
          forward-delay: 4
  ssh:
    allow-pw: true
    authorized-keys: []
    install-server: true
  storage:
    config:
      config:
      - type: disk
        id: disk0
        grub_device: true
        ptable: gpt
        wipe: superblock-recursive
        match:
          size: largest
        name: ""
        preserve: false

      - type: partition
        id: bios-grub-part
        device: disk0
        number: 1
        size: 1048576
        flag: bios_grub
        preserve: false
        grub_device: false
        wipe: superblock

      - type: partition
        id: boot-part
        device: disk0
        number: 2
        size: 2147483648
        preserve: false
        wipe: superblock

      - type: format
        id: boot-fs
        volume: boot-part
        fstype: ext4
        preserve: false

      - type: partition
        id: pv-part
        device: disk0
        number: 3
        size: -1
        preserve: false
        wipe: superblock

      - type: lvm_volgroup
        id: vg0
        name: ubuntu-vg
        devices: [ pv-part ]
        preserve: false

      - type: lvm_partition
        id: lv-swap
        volgroup: vg0
        name: swap
        size: 1073741824
        preserve: false
        wipe: superblock

      - type: format
        id: fs-swap
        volume: lv-swap
        fstype: swap
        preserve: false

      - type: lvm_partition
        id: lv-root
        volgroup: vg0
        name: ubuntu-lv
        size: -1
        preserve: false
        wipe: superblock

      - type: format
        id: fs-root
        volume: lv-root
        fstype: ext4
        preserve: false
      - type: mount
        id: mount-root
        path: /
        device: fs-root

      - type: mount
        id: mount-boot
        path: /boot
        device: boot-fs

      - type: mount
        id: mount-swap
        path: ""
        device: fs-swap
    swap:
      swap: 0
    grub:
      # This avoids a loop where we autoinstall, reboot to the autoinstaller USB, then autoinstall again and so on.
      reorder_uefi: False
  version: 1
  user-data:
    timezone: Asia/Shanghai
    # enable root account
    disable_root: false
  late-commands:
    - cp -rp /cdrom/mnt /target/
    - chmod +x /target/mnt/script/install-pkgs.sh
    - curtin in-target --target=/target -- /mnt/script/install-pkgs.sh
    - curtin in-target --target=/target -- touch /etc/cloud/cloud-init.disabled
    # copy template file to specify dirctory
    - curtin in-target --target=/target -- mv /mnt/template.xml /opt
    # copy local file to ISO
    - cp -rp /cdrom/mnt/service  /target/opt
    # to change template file parameters
    - chmod +x /target/mnt/script/config.sh
    - curtin in-target --target=/target -- /mnt/script/config.sh
    # startup kvm images to loading template file
    - cp /cdrom/rc-local.service /target/lib/systemd/system/rc-local.service
    - curtin in-target --target=/target -- ln -s /lib/systemd/system/rc-local.service /etc/systemd/system/rc-local.service
    - cp -p /cdrom/rc.local /target/etc/rc.local
    - chmod +x /target/etc/rc.local
    - systemctl daemon-reload
    #rm -rf /target/mnt/service